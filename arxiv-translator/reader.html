<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Arxiv Translation 中文 PDF</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; }
      body { margin: 0; background: #eef2f8; color: #172033; }
      main { width: 100%; height: 100vh; display: flex; flex-direction: column; }
      .reader-topbar { flex: 0 0 auto; min-height: 58px; display: flex; align-items: center; gap: 16px; padding: 9px 18px; background: rgba(255, 255, 255, .96); border-bottom: 1px solid #dbe2ed; box-shadow: 0 4px 18px rgba(27, 45, 80, .08); z-index: 2; }
      .reader-brand { color: #172033; font-weight: 750; text-decoration: none; }
      .reader-title { flex: 1; color: #596579; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .reader-tools a, .reader-tools button { border: 1px solid #d5ddea; border-radius: 7px; background: white; color: #2457d6; padding: 7px 10px; font: inherit; text-decoration: none; cursor: pointer; }
      .reader-meta { flex: 0 0 auto; min-height: 46px; display: flex; align-items: center; gap: 14px; padding: 6px 18px; background: #f7f9fc; border-bottom: 1px solid #dbe2ed; }
      .reader-meta p { margin: 0; color: #596579; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #status { color: #596579; }
      .error { color: #b42318 !important; white-space: pre-wrap; }
      #pdf-viewer { flex: 1 1 auto; min-height: 0; }
      .pdf-viewer { width: 100%; height: 100%; display: flex; flex-direction: column; background: #eef2f8; }
      .pdf-toolbar { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 9px 12px; background: #172033; color: #fff; }
      .pdf-toolbar button, .pdf-toolbar input, .pdf-open-link { border: 1px solid #45516a; border-radius: 7px; background: #26334c; color: #fff; padding: 7px 10px; font: inherit; text-decoration: none; }
      .pdf-toolbar button:disabled { opacity: .45; }
      .pdf-toolbar button.active { background: #2457d6; border-color: #75a0ff; }
      .pdf-toolbar input { width: 58px; text-align: center; }
      .pdf-page-total, .pdf-zoom-label { color: #d4dbea; min-width: 48px; }
      .pdf-viewer-status { flex: 0 0 auto; padding: 6px 12px; color: #596579; background: #fff; font-size: 13px; }
      .pdf-viewer-status.error { color: #b42318; }
      .pdf-page-stage { flex: 1 1 auto; min-height: 0; padding: 14px; overflow: auto; display: flex; justify-content: center; align-items: flex-start; }
      .pdf-page-frame { position: relative; flex: 0 0 auto; }
      .pdf-page-canvas { display: block; background: #fff; box-shadow: 0 8px 26px rgba(27, 45, 80, .16); }
      .pdf-text-layer { position: absolute; inset: 0; overflow: hidden; line-height: 1; transform-origin: 0 0; user-select: text; }
      .pdf-text-layer span { position: absolute; color: transparent; white-space: pre; cursor: text; transform-origin: 0 0; }
      .pdf-text-layer ::selection { background: rgba(37, 87, 214, .28); }
      @media (max-width: 700px) { .reader-topbar { padding: 8px 10px; } .reader-brand { display: none; } .reader-title { font-size: 14px; } .reader-meta { min-height: 40px; padding: 5px 10px; } .reader-tools a, .reader-tools button { padding: 6px 8px; font-size: 13px; } .pdf-toolbar { gap: 5px; padding: 8px; } .pdf-toolbar button, .pdf-toolbar input, .pdf-open-link { padding: 6px 7px; font-size: 13px; } .pdf-page-stage { padding: 8px; } }
    </style>
  </head>
  <body>
    <main>
      <header class="reader-topbar">
        <a class="reader-brand" href="./">Arxiv Translation</a>
        <div id="reader-title" class="reader-title">中文翻译 PDF</div>
        <div class="reader-tools"><button id="fullscreen" type="button">全屏</button><a href="./compare.html" id="compare-link">对照阅读</a></div>
      </header>
      <section class="reader-meta">
        <p id="summary">正在读取任务…</p>
        <div id="actions"></div>
        <div id="status"></div>
      </section>
      <div id="pdf-viewer" hidden></div>
    </main>
    <script src="config.js"></script>
    <script type="module">
      import { createPdfViewer } from './pdf-viewer.js';

      const jobId = new URLSearchParams(window.location.search).get('job') || '';
      const queryApiBase = new URLSearchParams(window.location.search).get('api') || '';
      const storedApiBase = readStoredApiBase();
      const configuredApiBase = window.ARXIV_API_BASE || queryApiBase || storedApiBase;
      const summary = document.getElementById('summary');
      const actions = document.getElementById('actions');
      const status = document.getElementById('status');
      const viewerRoot = document.getElementById('pdf-viewer');
      const readerTitle = document.getElementById('reader-title');
      const compareLink = document.getElementById('compare-link');

      function readStoredApiBase() {
        try { return localStorage.getItem('arxiv-translator-api-base') || ''; } catch (error) { return ''; }
      }

      function inferBackendBase() {
        if (window.location.protocol === 'file:') return 'http://127.0.0.1:8000';
        if (window.location.hostname.endsWith('.github.io')) return '';
        const path = window.location.pathname.replace(/\/+$/, '');
        return `${window.location.origin}${path.endsWith('/reader.html') ? path.slice(0, -'/reader.html'.length) : path}`;
      }

      const apiBase = (configuredApiBase || inferBackendBase()).replace(/\/+$/, '');
      function apiUrl(path) { return `${apiBase}${path}`; }
      function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character])); }
      function tokenSummary(job) {
        const total = Number(job.total_tokens);
        if (!Number.isFinite(total)) return '';
        const input = Number(job.input_tokens) || 0;
        const cached = Number(job.cached_input_tokens) || 0;
        const output = Number(job.output_tokens) || 0;
        const reasoning = Number(job.reasoning_output_tokens) || 0;
        const cost = Number(job.cost_usd);
        const model = job.pricing_model ? `（${job.pricing_model} Standard）` : '';
        const costText = Number.isFinite(cost) ? `，估算成本 $${cost.toFixed(6)} USD${model}` : '';
        return `累计 ${total} tokens（输入 ${input}，缓存输入 ${cached}，未缓存输入 ${Math.max(0, input - cached)}，输出 ${output}，其中推理 ${reasoning}${costText}）`;
      }

      document.getElementById('fullscreen').addEventListener('click', async () => {
        if (!document.fullscreenElement) await document.documentElement.requestFullscreen?.();
        else await document.exitFullscreen?.();
      });

      async function load() {
        if (!jobId) { status.className = 'error'; status.textContent = '缺少任务 ID'; return; }
        try {
          const response = await fetch(apiUrl(`/api/jobs/${encodeURIComponent(jobId)}`));
          const job = await response.json();
          if (!response.ok) throw new Error(job.error || `HTTP ${response.status}`);
          summary.textContent = `${job.arxiv_id} · ${job.message}`;
          readerTitle.textContent = `${job.arxiv_id} · 中文翻译 PDF`;
          compareLink.href = `./compare.html?job=${encodeURIComponent(job.id)}`;
          if (job.status !== 'completed' || !job.pdf_url) {
            status.className = job.status === 'failed' ? 'error' : '';
            status.textContent = job.error || '翻译任务尚未完成';
            return;
          }
          actions.innerHTML = `<a href="${escapeHtml(apiUrl(job.pdf_url))}" target="_blank" rel="noreferrer">下载中文 PDF</a><a href="${escapeHtml(job.original_pdf_url)}" target="_blank" rel="noreferrer">打开原文 PDF</a><a href="${escapeHtml(`compare.html?job=${encodeURIComponent(job.id)}`)}">对照阅读</a>`;
          status.textContent = tokenSummary(job);
          viewerRoot.hidden = false;
          await createPdfViewer(viewerRoot, apiUrl(job.pdf_url));
        } catch (error) {
          status.className = 'error';
          status.textContent = `无法读取任务：${error.message}`;
        }
      }

      load();
    </script>
  </body>
</html>
