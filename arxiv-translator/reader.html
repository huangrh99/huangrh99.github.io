<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Arxiv Translation 中文 PDF</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; }
      body { margin: 0; background: #e9edf4; color: #172033; }
      main { width: 100%; height: 100dvh; display: flex; flex-direction: column; }
      .topbar { flex: 0 0 auto; height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: #fff; border-bottom: 1px solid #dbe2ed; z-index: 3; }
      .brand { color: #172033; font-weight: 750; text-decoration: none; white-space: nowrap; }
      .title { flex: 1; min-width: 0; color: #596579; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tools { display: flex; align-items: center; gap: 6px; }
      .tool { border: 1px solid #d5ddea; border-radius: 7px; background: #fff; color: #2457d6; padding: 6px 10px; font: inherit; font-size: 13px; text-decoration: none; cursor: pointer; white-space: nowrap; }
      .tool:hover { background: #f1f5ff; }
      .tool.appendix { border-color: #5b4acb; background: #5b4acb; color: #fff; }
      .tool.appendix:disabled { opacity: .7; cursor: wait; }
      .tool[hidden] { display: none; }
      .info { position: relative; }
      .info summary { list-style: none; }
      .info summary::-webkit-details-marker { display: none; }
      .info-panel { position: absolute; right: 0; top: calc(100% + 6px); width: min(360px, calc(100vw - 24px)); padding: 12px 14px; border: 1px solid #dbe2ed; border-radius: 10px; background: #fff; box-shadow: 0 12px 32px rgba(23, 32, 51, .16); color: #596579; font-size: 13px; line-height: 1.6; z-index: 10; }
      .info-panel a { display: inline-block; margin: 4px 12px 0 0; color: #2457d6; }
      .notice { margin: auto; padding: 18px 22px; max-width: 560px; border-radius: 12px; background: #fff; color: #596579; box-shadow: 0 8px 24px rgba(23, 32, 51, .1); white-space: pre-wrap; }
      .notice.error { color: #b42318; }
      #pdf-viewer { flex: 1 1 auto; min-height: 0; }
      :root.pdf-night body { background: #1b2130; }
      @media (max-width: 700px) { .brand, .hide-narrow { display: none; } .topbar { gap: 8px; padding: 0 8px; } .tool { padding: 5px 8px; } }
    </style>
  </head>
  <body>
    <main>
      <header class="topbar">
        <a class="brand" href="./">Arxiv Translation</a>
        <div id="title" class="title">中文翻译 PDF</div>
        <div class="tools">
          <button id="appendix" class="tool appendix" type="button" hidden title="当前 PDF 的附录仍为英文原文">翻译附录</button>
          <a id="compare-link" class="tool" href="./compare.html">对照阅读</a>
          <button id="fullscreen" class="tool hide-narrow" type="button" title="全屏 (F)">全屏</button>
          <details class="info">
            <summary class="tool">信息</summary>
            <div id="info-panel" class="info-panel">正在读取任务…</div>
          </details>
        </div>
      </header>
      <div id="notice" class="notice">正在读取任务…</div>
      <div id="pdf-viewer" hidden></div>
    </main>
    <script src="config.js?v=20261120h"></script>
    <script src="formatters.js?v=20261120h"></script>
    <script type="module">
      import { createPdfViewer } from './pdf-viewer.js?v=20261120h';

      const params = new URLSearchParams(window.location.search);
      const jobId = params.get('job') || '';
      const queryApiBase = params.get('api') || '';
      const storedApiBase = readStoredApiBase();
      const configuredApiBase = window.ARXIV_API_BASE || queryApiBase || storedApiBase;
      const notice = document.getElementById('notice');
      const infoPanel = document.getElementById('info-panel');
      const viewerRoot = document.getElementById('pdf-viewer');
      const title = document.getElementById('title');
      const compareLink = document.getElementById('compare-link');
      let viewer;

      function readStoredApiBase() {
        try { return localStorage.getItem('arxiv-translator-api-base') || ''; } catch (error) { return ''; }
      }

      function inferBackendBase() {
        if (window.location.protocol === 'file:') return 'http://127.0.0.1:8000';
        if (window.location.hostname.endsWith('.github.io')) return '';
        const path = window.location.pathname.replace(/\/+$/, '');
        return `${window.location.origin}${path.endsWith('/reader.html') ? path.slice(0, -'/reader.html'.length) : path}`;
      }

      const apiBase = (configuredApiBase || inferBackendBase()).replace(/\/+$/, '');
      function apiUrl(path) { return `${apiBase}${path}`; }
      function escapeHtml(value) { return String(value ?? '').replace(/[&<>'"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character])); }
      function showNotice(text, isError = false) {
        notice.hidden = false;
        notice.className = isError ? 'notice error' : 'notice';
        notice.textContent = text;
      }
      function toggleFullscreen() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
        else document.exitFullscreen?.();
      }

      document.getElementById('fullscreen').addEventListener('click', toggleFullscreen);
      document.addEventListener('keydown', event => {
        if (event.target.closest('input, textarea, select, [contenteditable]')) return;
        if (event.key === 'f' && !event.metaKey && !event.ctrlKey && !event.altKey) { toggleFullscreen(); event.preventDefault(); return; }
        if (viewer && !event.target.closest('.pdf-stage') && viewer.handleKey(event)) event.preventDefault();
      });


      function setupAppendix(job) {
        const button = document.getElementById('appendix');
        const pending = window.arxivPendingAppendixCount(job);
        if (!pending) return;
        button.hidden = false;
        button.textContent = `翻译附录（${pending} 个文件）`;
        button.addEventListener('click', async () => {
          button.disabled = true;
          button.textContent = '附录翻译中…';
          try {
            await window.arxivTranslateAppendix(apiUrl, job.id, current => {
              button.textContent = `附录翻译中 ${current.progress || 0}%`;
            });
            window.location.reload();
          } catch (error) {
            button.disabled = false;
            button.textContent = '重试翻译附录';
            button.title = `翻译附录失败：${error.message}`;
          }
        });
      }

      async function load() {
        if (!jobId) { showNotice('缺少任务 ID', true); return; }
        try {
          const response = await fetch(apiUrl(`/api/jobs/${encodeURIComponent(jobId)}`));
          const job = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(job.error || `HTTP ${response.status}`);
          const displayId = job.display_arxiv_id || job.arxiv_id;
          document.title = `${displayId} · 中文 PDF`;
          title.textContent = job.title ? `${displayId} · ${job.title}` : `${displayId} · 中文翻译`;
          title.title = job.title || '';
          compareLink.href = `./compare.html?job=${encodeURIComponent(job.id)}`;
          const tokens = window.arxivTokenSummary(job);
          const duration = window.arxivDuration ? window.arxivDuration(job) : '';
          infoPanel.innerHTML = `<div>${escapeHtml(displayId)} · ${escapeHtml(job.message)}</div>${tokens ? `<div>${escapeHtml(tokens)}</div>` : ''}${duration ? `<div>耗时 ${escapeHtml(duration)}</div>` : ''}${Array.isArray(job.quality_issues) && job.quality_issues.length ? `<div style="margin-top:6px;color:#8a5a00">PDF 仍有问题：${job.quality_issues.map(escapeHtml).join('；')}</div>` : ''}<div>${job.pdf_url ? `<a href="${escapeHtml(apiUrl(job.pdf_url))}" target="_blank" rel="noreferrer">下载中文 PDF</a>` : ''}<a href="${escapeHtml(job.original_pdf_url)}" target="_blank" rel="noreferrer">原文 PDF</a><a href="${escapeHtml(job.arxiv_url)}" target="_blank" rel="noreferrer">arXiv 页面</a></div>`;
          if (job.status !== 'completed' || !job.pdf_url) {
            showNotice(job.error || `翻译任务尚未完成：${job.message || job.status}`, job.status === 'failed');
            return;
          }
          setupAppendix(job);
          notice.hidden = true;
          viewerRoot.hidden = false;
          viewer = await createPdfViewer(viewerRoot, apiUrl(`${job.pdf_url}?v=${job.updated_at || ''}`), { storageKey: `${job.id}:translated` });
          viewer.focus();
        } catch (error) {
          showNotice(`无法读取任务：${error.message}`, true);
        }
      }

      load();
    </script>
  </body>
</html>
