<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Arxiv Translation 对照阅读</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
      body { margin: 0; background: #f5f7fb; color: #172033; }
      main { max-width: 1500px; margin: 28px auto; padding: 0 20px 32px; }
      .card { background: white; border: 1px solid #e2e7f0; border-radius: 18px; padding: 22px; box-shadow: 0 12px 36px rgba(27, 45, 80, .08); }
      h1 { margin: 0 0 8px; font-size: 25px; }
      p { color: #596579; line-height: 1.6; }
      a { color: #2457d6; margin-right: 14px; }
      #status { margin-top: 14px; }
      .error { color: #b42318; white-space: pre-wrap; }
      .viewer-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 18px; }
      .viewer { min-width: 0; }
      .viewer h2 { margin: 0 0 10px; font-size: 18px; }
      iframe { display: block; width: 100%; height: 78vh; min-height: 560px; border: 1px solid #d9e0ec; border-radius: 10px; background: #eef2f8; }
      @media (max-width: 900px) { .viewer-grid { grid-template-columns: 1fr; } iframe { min-height: 70vh; } }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>Arxiv Translation 对照阅读</h1>
        <p id="summary">正在读取任务…</p>
        <div id="actions"></div>
        <div id="status"></div>
      </section>
      <section id="viewers" class="viewer-grid" hidden>
        <div class="card viewer">
          <h2>原文 PDF</h2>
          <iframe id="original-pdf" title="原文 PDF"></iframe>
        </div>
        <div class="card viewer">
          <h2>中文翻译 PDF</h2>
          <iframe id="translated-pdf" title="中文翻译 PDF"></iframe>
        </div>
      </section>
    </main>
    <script src="config.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const jobId = params.get('job') || '';
      const queryApiBase = params.get('api') || '';
      const storedApiBase = readStoredApiBase();
      const configuredApiBase = window.ARXIV_API_BASE || queryApiBase || storedApiBase;
      const apiBase = (configuredApiBase || (window.location.protocol === 'file:' ? 'http://127.0.0.1:8000' : '')).replace(/\/+$/, '');
      const summary = document.getElementById('summary');
      const actions = document.getElementById('actions');
      const status = document.getElementById('status');
      const viewers = document.getElementById('viewers');

      function readStoredApiBase() {
        try { return localStorage.getItem('arxiv-translator-api-base') || ''; } catch (error) { return ''; }
      }

      function apiUrl(path) { return `${apiBase}${path}`; }

      function escapeHtml(value) {
        return String(value).replace(/[&<>'"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character]));
      }

      async function load() {
        if (!jobId) {
          summary.textContent = '缺少任务 ID';
          return;
        }
        try {
          const response = await fetch(apiUrl(`/api/jobs/${encodeURIComponent(jobId)}`));
          const job = await response.json();
          if (!response.ok) throw new Error(job.error || `HTTP ${response.status}`);
          summary.textContent = `${job.arxiv_id} · ${job.message}`;
          actions.innerHTML = `<a href="${escapeHtml(job.arxiv_url)}" target="_blank">查看 arXiv 页面</a><a href="${escapeHtml(job.original_pdf_url)}" target="_blank">打开原文 PDF</a>${job.pdf_url ? `<a href="${apiUrl(job.pdf_url)}" target="_blank">打开中文 PDF</a>` : ''}`;
          if (job.status !== 'completed' || !job.pdf_url) {
            status.className = job.status === 'failed' ? 'error' : '';
            status.textContent = job.error || '翻译任务尚未完成';
            return;
          }
          status.textContent = Number.isFinite(job.total_tokens) ? `本篇论文消耗 ${job.total_tokens} tokens` : '';
          document.getElementById('original-pdf').src = job.original_pdf_url;
          document.getElementById('translated-pdf').src = apiUrl(job.pdf_url);
          viewers.hidden = false;
        } catch (error) {
          status.className = 'error';
          status.textContent = `无法读取任务：${error.message}`;
        }
      }

      load();
    </script>
  </body>
</html>
