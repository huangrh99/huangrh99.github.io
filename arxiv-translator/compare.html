<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Arxiv Translation 对照阅读</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; }
      body { margin: 0; background: #eef2f8; color: #172033; }
      main { width: 100%; height: 100vh; display: flex; flex-direction: column; }
      .compare-topbar { flex: 0 0 auto; min-height: 58px; display: flex; align-items: center; gap: 18px; padding: 9px 18px; background: rgba(255, 255, 255, .96); border-bottom: 1px solid #dbe2ed; box-shadow: 0 4px 18px rgba(27, 45, 80, .08); z-index: 2; }
      .compare-brand { color: #172033; font-weight: 750; text-decoration: none; white-space: nowrap; }
      .compare-title { flex: 1; min-width: 0; color: #596579; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .compare-tabs { display: flex; gap: 3px; padding: 3px; border-radius: 9px; background: #eef2f8; }
      .compare-tabs button, .compare-tool { border: 0; border-radius: 7px; background: transparent; color: #596579; padding: 8px 12px; font: inherit; cursor: pointer; white-space: nowrap; }
      .compare-tabs button.active, .compare-tool.active { background: #2457d6; color: white; }
      .compare-tools { display: flex; align-items: center; gap: 5px; }
      .compare-tool { border: 1px solid #d5ddea; background: white; text-decoration: none; }
      .compare-meta { flex: 0 0 auto; min-height: 50px; display: flex; align-items: center; gap: 16px; padding: 7px 18px; background: #f7f9fc; border-bottom: 1px solid #dbe2ed; }
      .compare-meta p { margin: 0; color: #596579; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #status { color: #596579; white-space: nowrap; }
      .compare-actions { display: flex; gap: 12px; margin-left: auto; white-space: nowrap; }
      .compare-actions a { color: #2457d6; }
      .error { color: #b42318 !important; white-space: pre-wrap; }
      .viewer-grid { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 12px; }
      .viewer { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: white; border: 1px solid #d9e0ec; border-radius: 14px; overflow: hidden; box-shadow: 0 8px 24px rgba(27, 45, 80, .08); }
      .viewer-heading { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; font-size: 17px; font-weight: 750; }
      .viewer-host { flex: 1 1 auto; min-height: 0; }
      .pdf-viewer { width: 100%; height: 100%; display: flex; flex-direction: column; border-top: 1px solid #d9e0ec; background: #eef2f8; }
      .pdf-toolbar { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 7px; padding: 8px 10px; background: #172033; color: #fff; }
      .pdf-toolbar button, .pdf-toolbar input, .pdf-open-link { border: 1px solid #45516a; border-radius: 7px; background: #26334c; color: #fff; padding: 7px 10px; font: inherit; text-decoration: none; }
      .pdf-toolbar button:disabled { opacity: .45; }
      .pdf-toolbar button.active { background: #2457d6; border-color: #75a0ff; }
      .pdf-toolbar input { width: 58px; text-align: center; }
      .pdf-page-total, .pdf-zoom-label { color: #d4dbea; min-width: 48px; }
      .pdf-viewer-status { flex: 0 0 auto; padding: 6px 10px; color: #596579; background: #fff; font-size: 13px; }
      .pdf-viewer-status.error { color: #b42318; }
      .pdf-page-stage { flex: 1 1 auto; min-height: 0; padding: 14px; overflow: auto; display: flex; justify-content: center; align-items: flex-start; }
      .pdf-page-frame { position: relative; flex: 0 0 auto; }
      .pdf-page-canvas { display: block; background: #fff; box-shadow: 0 8px 26px rgba(27, 45, 80, .16); }
      .pdf-text-layer { position: absolute; inset: 0; overflow: hidden; line-height: 1; transform-origin: 0 0; user-select: text; }
      .pdf-text-layer span { position: absolute; color: transparent; white-space: pre; cursor: text; transform-origin: 0 0; }
      .pdf-text-layer ::selection { background: rgba(37, 87, 214, .28); }
      body[data-mode="original"] #translated-panel, body[data-mode="translated"] #original-panel { display: none; }
      body[data-mode="original"] .viewer-grid, body[data-mode="translated"] .viewer-grid { grid-template-columns: minmax(0, 1fr); }
      @media (max-width: 900px) {
        .compare-topbar { gap: 8px; padding: 8px 10px; }
        .compare-brand { display: none; }
        .compare-title { font-size: 14px; }
        .compare-tools .compare-tool:not(.active) { display: none; }
        .viewer-grid { grid-template-columns: 1fr; }
      }
      @media (max-width: 620px) {
        .compare-title { display: none; }
        .compare-tabs button, .compare-tool { padding: 7px 8px; font-size: 13px; }
        .compare-meta { min-height: 40px; padding: 5px 10px; }
        .compare-actions a:nth-child(n+2), #status { display: none; }
        .viewer-grid { padding: 6px; gap: 6px; }
        .viewer-heading { padding: 7px 10px; font-size: 15px; }
        .pdf-toolbar { gap: 4px; padding: 6px; }
        .pdf-toolbar button, .pdf-toolbar input, .pdf-open-link { padding: 6px 7px; font-size: 13px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="compare-topbar">
        <a class="compare-brand" href="./">Arxiv Translation</a>
        <div id="compare-title" class="compare-title">对照阅读</div>
        <nav class="compare-tabs" aria-label="阅读模式">
          <button type="button" data-mode="original">原文</button>
          <button type="button" data-mode="translated">译文</button>
          <button type="button" data-mode="split" class="active">分屏</button>
        </nav>
        <div class="compare-tools">
          <button id="sync-pages" class="compare-tool active" type="button">⇄ 同步页码</button>
          <button id="fullscreen" class="compare-tool" type="button">全屏</button>
          <a id="paper-info" class="compare-tool" href="#">论文信息</a>
        </div>
      </header>
      <section class="compare-meta">
        <p id="summary">正在读取任务…</p>
        <div id="actions" class="compare-actions"></div>
        <div id="status"></div>
      </section>
      <section id="viewers" class="viewer-grid" hidden>
        <article id="original-panel" class="viewer"><div class="viewer-heading">原文 PDF</div><div class="viewer-host" id="original-viewer"></div></article>
        <article id="translated-panel" class="viewer"><div class="viewer-heading">中文翻译 PDF</div><div class="viewer-host" id="translated-viewer"></div></article>
      </section>
    </main>
    <script src="config.js"></script>
    <script src="formatters.js"></script>
    <script type="module">
      import { createPdfViewer } from './pdf-viewer.js';

      const params = new URLSearchParams(window.location.search);
      const jobId = params.get('job') || '';
      const queryApiBase = params.get('api') || '';
      const storedApiBase = readStoredApiBase();
      const configuredApiBase = window.ARXIV_API_BASE || queryApiBase || storedApiBase;
      const summary = document.getElementById('summary');
      const actions = document.getElementById('actions');
      const status = document.getElementById('status');
      const viewers = document.getElementById('viewers');
      const paperInfo = document.getElementById('paper-info');
      const syncPagesButton = document.getElementById('sync-pages');
      const fullscreenButton = document.getElementById('fullscreen');
      const modeButtons = [...document.querySelectorAll('[data-mode]')];
      let originalViewer;
      let translatedViewer;
      let syncPages = true;

      function readStoredApiBase() {
        try { return localStorage.getItem('arxiv-translator-api-base') || ''; } catch (error) { return ''; }
      }

      function inferBackendBase() {
        if (window.location.protocol === 'file:') return 'http://127.0.0.1:8000';
        if (window.location.hostname.endsWith('.github.io')) return '';
        const path = window.location.pathname.replace(/\/+$/, '');
        return `${window.location.origin}${path.endsWith('/compare.html') ? path.slice(0, -'/compare.html'.length) : path}`;
      }

      const apiBase = (configuredApiBase || inferBackendBase()).replace(/\/+$/, '');
      function apiUrl(path) { return `${apiBase}${path}`; }
      function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character])); }
      function setMode(mode) {
        document.body.dataset.mode = mode;
        modeButtons.forEach(button => button.classList.toggle('active', button.dataset.mode === mode));
      }

      modeButtons.forEach(button => button.addEventListener('click', () => setMode(button.dataset.mode)));
      syncPagesButton.addEventListener('click', () => {
        syncPages = !syncPages;
        syncPagesButton.classList.toggle('active', syncPages);
        syncPagesButton.textContent = syncPages ? '⇄ 同步页码' : '⇄ 独立页码';
      });
      fullscreenButton.addEventListener('click', async () => {
        if (!document.fullscreenElement) await document.documentElement.requestFullscreen?.();
        else await document.exitFullscreen?.();
      });

      async function load() {
        if (!jobId) { status.className = 'error'; status.textContent = '缺少任务 ID'; return; }
        try {
          const response = await fetch(apiUrl(`/api/jobs/${encodeURIComponent(jobId)}`));
          const job = await response.json();
          if (!response.ok) throw new Error(job.error || `HTTP ${response.status}`);
          summary.textContent = `${job.arxiv_id} · ${job.message}`;
          paperInfo.href = job.arxiv_url;
          actions.innerHTML = `<a href="${escapeHtml(job.arxiv_url)}" target="_blank" rel="noreferrer">查看 arXiv 页面</a><a href="${escapeHtml(job.original_pdf_url)}" target="_blank" rel="noreferrer">打开原文 PDF</a>${job.pdf_url ? `<a href="${escapeHtml(`reader.html?job=${encodeURIComponent(job.id)}`)}" target="_blank">打开中文 PDF</a>` : ''}`;
          if (job.status !== 'completed' || !job.pdf_url) {
            status.className = job.status === 'failed' ? 'error' : '';
            status.textContent = job.error || '翻译任务尚未完成';
            return;
          }
          status.textContent = window.arxivTokenSummary(job);
          viewers.hidden = false;
          [originalViewer, translatedViewer] = await Promise.all([
            createPdfViewer(document.getElementById('original-viewer'), job.original_pdf_url, {
              onPageChange: page => {
                if (syncPages && translatedViewer && translatedViewer.getPage() !== page) translatedViewer.setPage(page);
              },
            }),
            createPdfViewer(document.getElementById('translated-viewer'), apiUrl(job.pdf_url), {
              onPageChange: page => {
                if (syncPages && originalViewer && originalViewer.getPage() !== page) originalViewer.setPage(page);
              },
            }),
          ]);
        } catch (error) {
          status.className = 'error';
          status.textContent = `无法读取任务：${error.message}`;
        }
      }

      load();
    </script>
  </body>
</html>
