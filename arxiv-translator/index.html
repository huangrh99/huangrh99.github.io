<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ArXiv LaTeX Translator</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #f5f7fb; color: #172033; }
      main { max-width: 920px; margin: 8vh auto; padding: 0 20px; }
      .stack { display: grid; gap: 18px; }
      .card { background: white; border: 1px solid #e2e7f0; border-radius: 18px; padding: 28px; box-shadow: 0 12px 36px rgba(27, 45, 80, .08); }
      h1 { margin: 0 0 8px; font-size: 28px; }
      p { color: #596579; line-height: 1.6; }
      label { display: block; font-weight: 650; margin: 22px 0 8px; }
      input { box-sizing: border-box; width: 100%; padding: 13px 14px; border: 1px solid #cbd4e2; border-radius: 10px; font-size: 16px; }
      button { margin-top: 16px; border: 0; border-radius: 10px; padding: 12px 18px; background: #2457d6; color: white; font-size: 15px; cursor: pointer; }
      button:disabled { opacity: .55; cursor: wait; }
      #status { margin-top: 24px; padding: 18px 18px 16px; border-radius: 14px; background: #f5f8fe; border: 1px solid #e2e9f6; }
      #message:empty { display: none; }
      #message { margin-top: 10px; white-space: pre-line; }
      .job-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
      .job-title { min-width: 0; color: #172033; font-size: 17px; font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; }
      .job-badge { flex: 0 0 auto; padding: 3px 10px; border-radius: 999px; background: #e6edfb; color: #2457d6; font-size: 12px; font-weight: 650; white-space: nowrap; }
      .job-badge.completed { background: #e3f4ea; color: #16764a; }
      .job-badge.failed { background: #fdecea; color: #b42318; }
      .job-badge.queued { background: #f1f3f7; color: #596579; }
      .job-sub { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-top: 6px; color: #596579; font-size: 14px; }
      .job-sub span[hidden] { display: none; }
      .job-elapsed { color: #697589; font-variant-numeric: tabular-nums; }
      .job-percent { margin-left: auto; color: #172033; font-weight: 650; font-variant-numeric: tabular-nums; }
      .job-bar { height: 6px; margin-top: 10px; border-radius: 999px; background: #e2e8f3; overflow: hidden; }
      .job-bar > i { display: block; height: 100%; width: 0; border-radius: inherit; background: #2457d6; transition: width .4s ease; }
      #job-card[data-status="completed"] .job-bar > i { background: #16a34a; }
      #job-card[data-status="failed"] .job-bar > i { background: #b42318; }
      .job-error { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: #fdecea; color: #b42318; font-size: 13px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
      .job-warning { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: #fff7e0; color: #8a5a00; font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
      .job-warning ul { margin: 6px 0 0; padding-left: 18px; white-space: pre-wrap; }
      .job-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(108px, 1fr)); gap: 8px; margin-top: 14px; }
      .job-stats:empty { display: none; }
      .job-stat { display: flex; flex-direction: column; gap: 2px; padding: 9px 11px; border: 1px solid #e2e9f6; border-radius: 10px; background: #fff; }
      .job-stat span { color: #697589; font-size: 12px; }
      .job-stat strong { color: #172033; font-size: 17px; font-variant-numeric: tabular-nums; }
      .job-stat small { color: #8a94a8; font-size: 12px; }
      #links:empty { display: none; }
      #links { margin-top: 14px; }
      a { color: #2457d6; margin-right: 14px; }
      .error { color: #b42318; white-space: pre-wrap; }
      .success { color: #16764a; }
      .history-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .history-head h2 { margin: 0; font-size: 19px; white-space: nowrap; }
      .history-search { min-width: 0; max-width: 300px; padding: 10px 12px; font-size: 14px; }
      .history-list { display: grid; gap: 10px; margin-top: 16px; }
      .history-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 16px; width: 100%; text-align: left; border: 1px solid #e2e7f0; background: #fbfcff; color: #172033; border-radius: 12px; padding: 13px 14px; cursor: pointer; overflow: hidden; }
      .history-item:hover { border-color: #9db4ee; background: #f4f7ff; }
      .history-main { display: contents; }
      .history-id { min-width: 0; color: #172033; font-size: 16px; font-weight: 700; line-height: 1.45; overflow-wrap: anywhere; }
      .history-arxiv-id { grid-column: 1 / -1; margin-top: 2px; color: #697589; font-size: 13px; font-variant-numeric: tabular-nums; }
      .history-status { white-space: nowrap; }
      .history-meta { grid-column: 1 / -1; min-width: 0; color: #697589; font-size: 13px; line-height: 1.5; margin-top: 6px; overflow-wrap: anywhere; }
      .history-empty { color: #697589; padding: 12px 0; }
      .history-actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 8px; font-size: 14px; }
      .history-actions a { margin-right: 0; white-space: nowrap; }
      .history-actions .appendix-button { margin: 0; }
      details { margin-top: 18px; color: #596579; }
      summary { cursor: pointer; font-weight: 650; color: #39465d; }
      .backend-row { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
      .backend-row input { flex: 1; }
      .backend-row button { margin-top: 0; white-space: nowrap; }
      .hint { margin: 8px 0 0; font-size: 13px; }
      .result-links { display: flex; flex-wrap: wrap; gap: 8px 0; }
      .retry-button { margin: 0 14px 0 0; padding: 8px 12px; background: #b42318; }
      .appendix-button { margin: 0 14px 0 0; padding: 8px 12px; background: #5b4acb; }
      .history-appendix { padding: 5px 10px; font-size: 13px; }
      .service-status { display: flex; align-items: center; gap: 8px; margin: 10px 0 4px; color: #596579; font-size: 14px; }
      .status-dot { width: 9px; height: 9px; border-radius: 50%; background: #9aa6b8; }
      .status-dot.connected { background: #16764a; }
      .status-dot.disconnected, .status-dot.error { background: #b42318; }
      .status-dot.checking { background: #c78100; }
      .service-status small { color: #697589; }
    </style>
  </head>
  <body>
    <main>
      <div class="stack">
        <section class="card">
          <h1>ArXiv LaTeX Translator</h1>
          <p>输入 arXiv 链接或论文 ID。工具会保护公式、图片和表格内容，翻译正文与 caption，再编译中文 PDF。</p>
          <div class="service-status"><span id="codex-status-dot" class="status-dot"></span><span>Codex CLI</span><strong id="codex-status-label">未验证</strong><small id="codex-status-detail"></small></div>
          <form id="job-form">
            <label for="source">arXiv 链接或 ID</label>
            <input id="source" name="source" placeholder="例如 2401.12345 或 https://arxiv.org/abs/2401.12345" required>
            <button id="submit" type="submit">开始翻译</button>
          </form>
          <details>
            <summary>后端连接设置</summary>
            <div class="backend-row">
              <input id="backend-url" type="url" placeholder="例如 https://translator.example.com">
              <button id="save-backend" type="button">保存地址</button>
            </div>
            <p class="hint">GitHub Pages 页面需要填入可从浏览器访问的 HTTPS 后端地址。地址只保存在当前浏览器。</p>
          </details>
          <div id="status" hidden>
            <div id="job-card" hidden>
              <div class="job-head">
                <div id="job-title" class="job-title"></div>
                <span id="job-badge" class="job-badge"></span>
              </div>
              <div class="job-sub"><span id="job-id"></span><span id="job-stage"></span><span id="job-elapsed" class="job-elapsed"></span><span id="job-percent" class="job-percent"></span></div>
              <div class="job-bar" aria-hidden="true"><i id="job-bar-fill"></i></div>
              <div id="job-error" class="job-error" hidden></div>
              <div id="job-warning" class="job-warning" hidden></div>
              <div id="job-stats" class="job-stats"></div>
            </div>
            <div id="message"></div>
            <div id="links"></div>
          </div>
        </section>
        <section class="card">
          <div class="history-head">
            <h2>历史翻译</h2>
            <input id="history-query" class="history-search" placeholder="搜索标题、arXiv ID 或链接" aria-label="搜索历史翻译">
          </div>
          <div id="history-list" class="history-list"><div class="history-empty">正在读取历史任务…</div></div>
        </section>
      </div>
    </main>
    <script src="config.js?v=20261120h"></script>
    <script src="formatters.js?v=20261120h"></script>
    <script>
      const form = document.getElementById('job-form');
      const button = document.getElementById('submit');
      const statusBox = document.getElementById('status');
      const message = document.getElementById('message');
      const jobCard = document.getElementById('job-card');
      const jobTitle = document.getElementById('job-title');
      const jobBadge = document.getElementById('job-badge');
      const jobId = document.getElementById('job-id');
      const jobStage = document.getElementById('job-stage');
      const jobPercent = document.getElementById('job-percent');
      const jobElapsed = document.getElementById('job-elapsed');
      const jobBarFill = document.getElementById('job-bar-fill');
      const jobError = document.getElementById('job-error');
      const jobWarning = document.getElementById('job-warning');
      const jobStats = document.getElementById('job-stats');
      const links = document.getElementById('links');
      const historyQuery = document.getElementById('history-query');
      const historyList = document.getElementById('history-list');
      const codexStatusDot = document.getElementById('codex-status-dot');
      const codexStatusLabel = document.getElementById('codex-status-label');
      const codexStatusDetail = document.getElementById('codex-status-detail');
      const backendUrl = document.getElementById('backend-url');
      const saveBackend = document.getElementById('save-backend');
      const queryApiBase = new URLSearchParams(window.location.search).get('api') || '';
      const storedApiBase = readStoredApiBase();
      const configuredApiBase = window.ARXIV_API_BASE || queryApiBase || storedApiBase;
      function inferBackendBase() {
        if (window.location.protocol === 'file:') return 'http://127.0.0.1:8000';
        if (window.location.hostname.endsWith('.github.io')) return '';
        const path = window.location.pathname.replace(/\/index\.html$/, '').replace(/\/+$/, '');
        return `${window.location.origin}${path}`;
      }
      let apiBase = (configuredApiBase || inferBackendBase()).replace(/\/+$/, '');
      let timer;

      backendUrl.value = apiBase;

      function readStoredApiBase() {
        try {
          return localStorage.getItem('arxiv-translator-api-base') || '';
        } catch (error) {
          return '';
        }
      }

      function storeApiBase(value) {
        try {
          localStorage.setItem('arxiv-translator-api-base', value);
        } catch (error) {
          // Some file:// browser contexts disable local storage.
        }
      }

      function connectionMessage() {
        return apiBase ? `无法连接后端，请检查 ${apiBase} 是否正在运行并允许跨域访问` : '无法连接后端，请先配置后端地址';
      }

      function renderCodexStatus(value) {
        const labels = {unknown: '未验证', checking: '检查中', connected: '已连接', disconnected: '认证失效', error: '调用错误'};
        const status = value && value.status ? value.status : 'unknown';
        codexStatusDot.className = `status-dot ${status}`;
        codexStatusLabel.textContent = labels[status] || status;
        codexStatusDetail.textContent = value && value.message ? ` · ${value.message}` : '';
      }

      async function loadCodexStatus() {
        try {
          const response = await fetch(apiUrl('/api/status'));
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          renderCodexStatus(data.codex_cli);
        } catch (error) {
          renderCodexStatus({status: 'error', message: connectionMessage()});
        }
      }

      function resultLinks(job) {
        const compareUrl = `compare.html?job=${encodeURIComponent(job.id)}`;
        return `<div class="result-links">${appendixLink(job)}<a href="${escapeHtml(job.arxiv_url)}" target="_blank" rel="noreferrer">Arxiv</a><a href="${escapeHtml(compareUrl)}" target="_blank">翻译阅读</a></div>`;
      }

      function retryLink(job) {
        return `<button class="retry-button" data-retry-job-id="${escapeHtml(job.id)}" type="button">复用源码重试</button>`;
      }

      function appendixLink(job) {
        return Array.isArray(job.appendix_files) && job.appendix_files.length ? `<button class="appendix-button" data-appendix-job-id="${escapeHtml(job.id)}" type="button">继续翻译 Appendix</button>` : '';
      }

      async function retryJob(id) {
        const retryButton = document.querySelector(`[data-retry-job-id="${CSS.escape(id)}"]`);
        if (retryButton) retryButton.disabled = true;
        try {
          const response = await fetch(apiUrl(`/api/jobs/${encodeURIComponent(id)}/retry`), {method: 'POST'});
          const job = await response.json();
          if (!response.ok) throw new Error(job.error || `HTTP ${response.status}`);
          watchedJobId = job.id;
          showJob(job);
          if (job.status !== 'completed' && job.status !== 'failed') watchJob(job.id);
        } catch (error) {
          statusBox.hidden = false;
          message.className = 'error';
          message.textContent = `重试失败：${error.message}`;
          if (retryButton) retryButton.disabled = false;
        }
      }

      async function translateAppendix(id) {
        const appendixButton = document.querySelector(`[data-appendix-job-id="${CSS.escape(id)}"]`);
        if (appendixButton) appendixButton.disabled = true;
        try {
          const response = await fetch(apiUrl(`/api/jobs/${encodeURIComponent(id)}/appendix`), {method: 'POST'});
          const job = await response.json();
          if (!response.ok) throw new Error(job.error || `HTTP ${response.status}`);
          watchedJobId = job.id;
          showJob(job);
          if (job.status !== 'completed' && job.status !== 'failed') watchJob(job.id);
        } catch (error) {
          statusBox.hidden = false;
          message.className = 'error';
          message.textContent = `翻译 Appendix 失败：${error.message}`;
          if (appendixButton) appendixButton.disabled = false;
        }
      }

      saveBackend.addEventListener('click', () => {
        apiBase = backendUrl.value.trim().replace(/\/+$/, '');
        storeApiBase(apiBase);
        loadHistory();
      });

      function apiUrl(path) {
        return `${apiBase}${path}`;
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>'"]/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[character]));
      }

      function historyStatus(job) {
        const labels = {completed: '已完成', failed: '失败', running: '进行中', queued: '排队中'};
        const label = labels[job.status] || job.status;
        return job.status === 'completed' && Array.isArray(job.quality_issues) && job.quality_issues.length ? `${label} · 有警告` : label;
      }

      function renderHistory(jobs) {
        if (!jobs.length) {
          historyList.innerHTML = '<div class="history-empty">没有匹配的历史任务</div>';
          return;
        }
        historyList.innerHTML = jobs.map(job => {
          const updated = job.updated_at ? new Date(job.updated_at * 1000).toLocaleString() : '';
          const brief = window.arxivTokenBrief ? window.arxivTokenBrief(job) : '';
          const duration = window.arxivDuration ? window.arxivDuration(job) : '';
          const tokens = (duration ? ` · 用时 ${escapeHtml(duration)}` : '') + (brief ? ` · <span title="${escapeHtml(window.arxivTokenSummary(job))}">${escapeHtml(brief)}</span>` : '');
          const displayId = job.display_arxiv_id || job.arxiv_id;
          const pendingAppendix = typeof window.arxivPendingAppendixCount === 'function' ? window.arxivPendingAppendixCount(job) : 0;
          const appendixAction = pendingAppendix ? `<button class="appendix-button history-appendix" data-appendix-job-id="${escapeHtml(job.id)}" type="button">继续翻译 Appendix（${pendingAppendix} 个文件）</button>` : '';
          const readLinks = job.status === 'completed' && job.pdf_url ? `<div class="history-actions">${appendixAction}<a href="${escapeHtml(`compare.html?job=${encodeURIComponent(job.id)}`)}" target="_blank">翻译阅读</a></div>` : '';
          return `<div class="history-item" role="button" tabindex="0" data-job-id="${escapeHtml(job.id)}"><div class="history-main"><span class="history-id">${escapeHtml(job.title || displayId)}</span><span class="history-status">${historyStatus(job)}</span></div>${job.title ? `<div class="history-arxiv-id">arXiv ${escapeHtml(displayId)}</div>` : ''}<div class="history-meta">${escapeHtml(updated)}${tokens}</div>${readLinks}</div>`;
        }).join('');
      }

      let historyRequest = 0;
      async function loadHistory() {
        const requestId = ++historyRequest;
        try {
          const query = encodeURIComponent(historyQuery.value.trim());
          const response = await fetch(apiUrl(`/api/jobs?query=${query}`));
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          if (requestId !== historyRequest) return;
          try {
            renderHistory(data.jobs || []);
          } catch (renderError) {
            // A rendering bug is not a connection problem; say what actually failed.
            historyList.innerHTML = `<div class="history-empty">历史列表显示失败：${escapeHtml(renderError.message)}（请强制刷新页面）</div>`;
          }
        } catch (error) {
          if (requestId !== historyRequest) return;
          historyList.innerHTML = `<div class="history-empty">${escapeHtml(connectionMessage())}</div>`;
        }
      }

      function showJob(job) {
        statusBox.hidden = false;
        jobCard.hidden = false;
        message.className = '';
        message.textContent = '';
        const displayId = job.display_arxiv_id || job.arxiv_id || '';
        const percent = Math.max(0, Math.min(100, Number(job.progress) || 0));
        jobTitle.textContent = job.title || displayId;
        jobId.textContent = job.title && displayId ? `arXiv ${displayId}` : '';
        jobId.hidden = !jobId.textContent;
        jobStage.textContent = job.message || '';
        jobPercent.textContent = `${percent}%`;
        const duration = window.arxivDuration ? window.arxivDuration(job) : '';
        jobElapsed.textContent = duration ? `用时 ${duration}` : '';
        jobElapsed.hidden = !duration;
        jobBadge.textContent = historyStatus(job);
        jobBadge.className = `job-badge ${job.status || ''}`;
        jobCard.dataset.status = job.status || '';
        jobBarFill.style.width = `${percent}%`;
        jobError.hidden = !job.error;
        jobError.textContent = job.error || '';
        const warnings = job.status === 'completed' && Array.isArray(job.quality_issues) ? job.quality_issues : [];
        jobWarning.hidden = !warnings.length;
        jobWarning.innerHTML = warnings.length
          ? `<strong>PDF 仍有 ${warnings.length} 个问题，自动修复未能解决：</strong><ul>${warnings.map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul>`
          : '';
        jobStats.innerHTML = window.arxivTokenStats(job).map(stat => `<div class="job-stat"><span>${escapeHtml(stat.label)}</span><strong>${escapeHtml(stat.value)}</strong>${stat.detail ? `<small>${escapeHtml(stat.detail)}</small>` : ''}</div>`).join('');
        if (job.status !== 'completed' && job.status !== 'failed') links.innerHTML = '';
        if (job.status === 'completed') {
          links.innerHTML = resultLinks(job);
          button.disabled = false;
          clearInterval(timer);
          loadHistory();
        } else if (job.status === 'failed') {
          links.innerHTML = `${retryLink(job)}${job.log_url ? `<a href="${escapeHtml(apiUrl(job.log_url))}" target="_blank">查看日志</a>` : ''}`;
          button.disabled = false;
          clearInterval(timer);
          loadHistory();
        }
      }

      let watchedJobId = '';

      function watchJob(id) {
        watchedJobId = id;
        clearInterval(timer);
        timer = setInterval(() => poll(id), 1000);
      }

      async function poll(id) {
        try {
          const response = await fetch(apiUrl(`/api/jobs/${encodeURIComponent(id)}`));
          const job = await response.json().catch(() => ({}));
          if (id !== watchedJobId) return;
          if (!response.ok) throw new Error(job.error || `HTTP ${response.status}`);
          showJob(job);
        } catch (error) {
          if (id !== watchedJobId) return;
          if (error instanceof TypeError) {
            statusBox.hidden = false;
            message.className = 'error';
            message.textContent = connectionMessage();
            return;
          }
          clearInterval(timer);
          statusBox.hidden = false;
          message.className = 'error';
          message.textContent = `读取任务失败：${error.message}`;
        }
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        button.disabled = true;
        links.innerHTML = '';
        let response;
        try {
          response = await fetch(apiUrl('/api/jobs'), { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({source: document.getElementById('source').value}) });
        } catch (error) {
          statusBox.hidden = false;
          message.className = 'error';
          message.textContent = connectionMessage();
          button.disabled = false;
          return;
        }
        const job = await response.json().catch(() => ({}));
        if (!response.ok) {
          statusBox.hidden = false;
          message.className = 'error';
          message.textContent = job.error || '提交失败';
          button.disabled = false;
          return;
        }
        watchedJobId = job.id;
        showJob(job);
        if (job.status !== 'completed' && job.status !== 'failed') watchJob(job.id);
      });

      historyList.addEventListener('click', event => {
        if (event.target.closest('a')) return;
        const appendixButton = event.target.closest('[data-appendix-job-id]');
        if (appendixButton) {
          translateAppendix(appendixButton.dataset.appendixJobId);
          return;
        }
        const item = event.target.closest('[data-job-id]');
        if (!item) return;
        openHistoryJob(item.dataset.jobId);
      });

      historyList.addEventListener('keydown', event => {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        if (event.target.closest('a')) return;
        const item = event.target.closest('[data-job-id]');
        if (!item) return;
        event.preventDefault();
        openHistoryJob(item.dataset.jobId);
      });

      function openHistoryJob(id) {
        links.innerHTML = '';
        watchJob(id);
        poll(id);
      }

      links.addEventListener('click', event => {
        const retryButton = event.target.closest('[data-retry-job-id]');
        if (retryButton) retryJob(retryButton.dataset.retryJobId);
        const appendixButton = event.target.closest('[data-appendix-job-id]');
        if (appendixButton) translateAppendix(appendixButton.dataset.appendixJobId);
      });

      let historyTimer;
      historyQuery.addEventListener('input', () => {
        clearTimeout(historyTimer);
        historyTimer = setTimeout(loadHistory, 200);
      });

      loadHistory();
      loadCodexStatus();
      setInterval(loadCodexStatus, 15000);
    </script>
  </body>
</html>
