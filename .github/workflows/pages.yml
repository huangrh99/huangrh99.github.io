name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inject private backend configuration into the build artifact
        env:
          ARXIV_API_BASE: ${{ secrets.ARXIV_API_BASE }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          value = os.environ.get("ARXIV_API_BASE", "").strip()
          Path("arxiv-translator/config.js").write_text(
              "// Generated during Pages deployment.\n"
              f"window.ARXIV_API_BASE = {json.dumps(value)};\n",
              encoding="utf-8",
          )
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
